<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>generateList</title>
</head>
<body>

<script>
    // Завдання
    // Написати функцію generateList(array), яка приймає масив із чисел та масивів чисел
    // і генерує вкладений список <ul>/<li>.
    // Для перевірки масиву використовувати Array.isArray().

    function generateList(array) {
        const ul = document.createElement("ul");

        array.forEach((item) => {
            const li = document.createElement("li");

            if (Array.isArray(item)) {
                li.appendChild(generateList(item));
            } else {
                li.textContent = item;
            }

            ul.appendChild(li);
        });

        return ul;
    }

    // --- Перевірка ---

    const data = [1, 2, [1.1, 1.2, 1.3], 3];

    document.body.appendChild(generateList(data));
</script>

</body>
</html>
